  /api/search:
    get:
      tags:
        - Search
      operationId: search
      summary: Global search across the DELIVERY entities (clients, projects,
        environments, servers), grouped by type and ranked by relevance
      description: "Hybrid matching: Postgres full-text (prefix tsquery + ts_rank)
        over the prose fields, OR substring (ILIKE) over identifier fields such
        as hostname, IP address and tech stack — the 'english' parser tokenises
        hostnames and INETs as single opaque units, so substring matching is
        what makes `prod` find `web-prod-01.example.com`. Soft-deleted rows are
        always excluded. An empty or whitespace-only `q` returns empty groups
        rather than an error."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: Search term. Empty returns empty groups.
          required: false
          description: Search term. Empty returns empty groups.
          name: q
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 20
            description: "Max hits per entity type. Default: 5. Clamped, not rejected, when
              out of range."
          required: false
          description: "Max hits per entity type. Default: 5. Clamped, not rejected, when
            out of range."
          name: limit
          in: query
      responses:
        "200":
          description: Grouped, relevance-ranked search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
