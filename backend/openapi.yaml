openapi: 3.0.0
info:
  title: QQM API
  version: 1.0.0
  description: Client / project / infrastructure management API. Generated from
    the actual implemented routes, controllers, and zod validators
    (backend/src/openapi) — not from any prior design document.
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC
servers:
  - url: /
    description: Same-origin backend
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT obtained from POST /api/auth/login, sent as `Authorization:
        Bearer <token>`."
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        peopleId:
          type: string
          nullable: true
          format: uuid
        roles:
          type: array
          items:
            type: string
      required:
        - id
        - username
        - email
        - peopleId
        - roles
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
            - message
      required:
        - error
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INTERNAL_ERROR
    ClientListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - name
        - status
        - description
        - created_at
        - updated_at
        - deleted_at
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required:
        - page
        - per_page
        - total
        - total_pages
    PersonForClient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/PeopleType"
        deleted_at:
          type: string
          nullable: true
          format: date-time
        relationship_type:
          type: string
          nullable: true
      required:
        - id
        - name
        - email
        - phone
        - type
        - deleted_at
        - relationship_type
    PeopleType:
      type: string
      enum:
        - internal_engineer
        - vendor
        - client_contact
        - project_owner
        - approver
    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        owner_status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - client_id
        - name
        - description
        - owner_status
        - created_at
        - updated_at
        - deleted_at
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            client:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
          required:
            - client
    ProjectPersonEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        role_in_project:
          type: string
        created_at:
          type: string
          format: date-time
        person:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              nullable: true
            type:
              type: string
            deleted_at:
              type: string
              nullable: true
              format: date-time
          required:
            - id
            - name
            - email
            - type
            - deleted_at
      required:
        - id
        - project_id
        - role_in_project
        - created_at
        - person
    EnvironmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    Environment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
        vpn_resource_id:
          type: string
          nullable: true
          format: uuid
      required:
        - id
        - project_id
        - name
        - description
        - created_at
        - updated_at
        - deleted_at
        - vpn_resource_id
    EnvironmentDetail:
      allOf:
        - $ref: "#/components/schemas/Environment"
        - type: object
          properties:
            project:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
          required:
            - project
    ServerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Server"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        hostname:
          type: string
        ip_address:
          type: string
          nullable: true
        tech_stack:
          type: array
          items:
            type: string
        monitoring_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
        display_name:
          type: string
        service_type:
          $ref: "#/components/schemas/ServiceType"
        access_method:
          $ref: "#/components/schemas/AccessMethod"
        access_host:
          type: string
        access_port:
          type: integer
          nullable: true
        access_path:
          type: string
          nullable: true
      required:
        - id
        - environment_id
        - hostname
        - ip_address
        - tech_stack
        - monitoring_url
        - notes
        - created_at
        - updated_at
        - deleted_at
        - display_name
        - service_type
        - access_method
        - access_host
        - access_port
        - access_path
    ServiceType:
      type: string
      nullable: true
      enum:
        - application
        - database
        - proxy
        - monitoring
        - repository
        - metrics
        - jump_host
        - other
        - null
    AccessMethod:
      type: string
      nullable: true
      enum:
        - ssh
        - rdp
        - telnet
        - web
        - other
        - null
    ServerDetail:
      allOf:
        - $ref: "#/components/schemas/Server"
        - type: object
          properties:
            environment:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                project:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                  required:
                    - id
                    - name
              required:
                - id
                - name
                - project
          required:
            - environment
    CredentialReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        label:
          type: string
        reference_location:
          type: string
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        applies_to_access_method:
          $ref: "#/components/schemas/AccessMethod"
      required:
        - id
        - server_id
        - label
        - reference_location
        - notes
        - created_at
        - applies_to_access_method
    ResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    ResourceListItem:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            current_version:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                version_number:
                  type: integer
                created_at:
                  type: string
                  format: date-time
                author:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                  required:
                    - id
                    - name
              required:
                - id
                - version_number
                - created_at
                - author
          required:
            - current_version
    ResourceType:
      type: string
      enum:
        - runbook
        - sop
        - architecture
        - troubleshooting
        - faq
        - link
        - pdf
    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          nullable: true
          format: uuid
        type:
          $ref: "#/components/schemas/ResourceType"
        title:
          type: string
        category:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        current_version_id:
          type: string
          nullable: true
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - project_id
        - type
        - title
        - category
        - tags
        - current_version_id
        - created_at
        - updated_at
        - deleted_at
    ResourceDetail:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            current_version:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                version_number:
                  type: integer
                created_at:
                  type: string
                  format: date-time
                author:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                  required:
                    - id
                    - name
                content:
                  type: string
                  nullable: true
                external_url:
                  type: string
                  nullable: true
                file_path:
                  type: string
                  nullable: true
                content_hash:
                  type: string
                commit_message:
                  type: string
                  nullable: true
              required:
                - id
                - version_number
                - created_at
                - author
                - content
                - external_url
                - file_path
                - content_hash
                - commit_message
          required:
            - current_version
    ResourceVersionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceVersionSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    ResourceVersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version_number:
          type: integer
        commit_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
      required:
        - id
        - version_number
        - commit_message
        - created_at
        - author
    ResourceVersionWithAuthor:
      allOf:
        - $ref: "#/components/schemas/ResourceVersion"
        - type: object
          properties:
            author:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
          required:
            - author
    ResourceVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        version_number:
          type: integer
        content:
          type: string
          nullable: true
        content_hash:
          type: string
        external_url:
          type: string
          nullable: true
        file_path:
          type: string
          nullable: true
        commit_message:
          type: string
          nullable: true
        author_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
        - id
        - resource_id
        - version_number
        - content
        - content_hash
        - external_url
        - file_path
        - commit_message
        - author_id
        - created_at
    CreateVersionResult:
      type: object
      properties:
        version:
          $ref: "#/components/schemas/ResourceVersion"
        warning:
          type: string
      required:
        - version
    PersonListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/PeopleType"
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - name
        - email
        - phone
        - type
        - notes
        - created_at
        - updated_at
        - deleted_at
    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          properties:
            clients:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  relationship_type:
                    type: string
                    nullable: true
                required:
                  - id
                  - name
                  - relationship_type
            account:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                active:
                  type: boolean
              required:
                - id
                - username
                - active
          required:
            - clients
            - account
    ScheduleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    ScheduleListItem:
      allOf:
        - $ref: "#/components/schemas/Schedule"
        - type: object
          properties:
            is_overdue:
              type: boolean
          required:
            - is_overdue
    ScheduleType:
      type: string
      enum:
        - PM
        - MA
        - other
    ScheduleStatus:
      type: string
      enum:
        - pending
        - in_progress
        - done
        - cancelled
    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          nullable: true
          format: uuid
        server_id:
          type: string
          nullable: true
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/ScheduleType"
        scheduled_date:
          type: string
        started_at:
          type: string
          nullable: true
          format: date-time
        completed_at:
          type: string
          nullable: true
          format: date-time
        assigned_to:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - project_id
        - server_id
        - title
        - type
        - scheduled_date
        - started_at
        - completed_at
        - assigned_to
        - status
        - notes
        - created_at
        - updated_at
        - deleted_at
    ScheduleDetail:
      allOf:
        - $ref: "#/components/schemas/Schedule"
        - type: object
          properties:
            is_overdue:
              type: boolean
            assigned_to_person:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
            project:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
            server:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
          required:
            - is_overdue
            - assigned_to_person
            - project
            - server
    ActivityLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/ActivityAction"
        changed_by:
          type: string
          format: uuid
        old_value:
          type: object
          additionalProperties: true
        new_value:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        changed_by_person:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
      required:
        - id
        - entity_type
        - entity_id
        - action
        - changed_by
        - created_at
        - changed_by_person
    EntityType:
      type: string
      enum:
        - client
        - project
        - environment
        - server
        - credential_reference
        - people
        - resource
        - resource_version
        - schedule
        - user
    ActivityAction:
      type: string
      enum:
        - create
        - update
        - delete
        - restore
    SearchResults:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        servers:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
          description: Total hits returned across all four groups, after per-type limiting.
      required:
        - clients
        - projects
        - environments
        - servers
        - total
    SearchHit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/SearchEntityType"
        label:
          type: string
          description: "Primary identifying text: the entity's name, or display_name for
            servers."
        secondary:
          type: string
          nullable: true
          description: One distinguishing field — client status, a project's client, an
            environment's project, a server's IP (falling back to hostname).
      required:
        - id
        - type
        - label
        - secondary
    SearchEntityType:
      type: string
      enum:
        - client
        - project
        - environment
        - server
  parameters: {}
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - username
                - password
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - token
                  - user
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Log out (client-side token discard; no server-side session to invalidate)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/change-password:
    post:
      tags:
        - Auth
      operationId: changePassword
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  minLength: 1
                new_password:
                  type: string
                  minLength: 8
              required:
                - current_password
                - new_password
